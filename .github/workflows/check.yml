name: check

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - claude/tender-rubin-n26gr6

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install workbench dependencies
        run: npm ci

      - name: Check workbench
        run: npm run check

      - name: Build workbench
        run: npm run build

      - name: Install MCP dependencies
        run: npm ci
        working-directory: mcp

      - name: Typecheck MCP server
        run: npx tsc --noEmit
        working-directory: mcp
