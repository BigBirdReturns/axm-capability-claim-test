name: garpa-commons-seeded-build-manifest-check

on:
  pull_request:
    paths:
      - "app/src/types/garpaCommonsSeededBuildManifest.ts"
      - "app/src/lib/garpa/commonsSeededBuildManifestDigest.ts"
      - "app/src/lib/garpa/validateCommonsSeededBuildManifest.ts"
      - "app/src/lib/garpa/runCommonsSeededBuildManifestGate.ts"
      - "app/src/lib/garpa/renderCommonsSeededBuildManifest.ts"
      - "app/src/lib/garpa/garpaVersion.ts"
      - "app/src/lib/garpa/implementedStages.ts"
      - "tests/fixtures/garpaCommonsSeededBuildManifestFixture.ts"
      - "tests/lib/garpaCommonsSeededBuildManifest.test.ts"
      - "tests/lib/garpaMethodVersion.test.ts"
      - "examples/garpa-commons-seeded-build-manifest/**"
      - "schemas/garpa/commons-seeded-build-manifest-*.schema.json"
      - "docs/garpa-commons-seeded-build-manifest.md"
      - "docs/garpa-method-version.md"
      - "mcp/garpaCommonsSeededBuildManifestTools.ts"
      - "mcp/garpa-commons-seeded-build-manifest-server.ts"
      - "mcp/tsconfig.commons-seeded-build-manifest.json"
      - "mcp/README-GARPA-COMMONS-SEEDED-BUILD-MANIFEST.md"
      - "mcp/garpaCompleteServer.ts"
      - "tsconfig.commons-seeded-build-manifest.json"
      - ".github/workflows/garpa-commons-seeded-build-manifest-check.yml"
  push:
    branches:
      - "feature/garpa-commons-seeded-build-manifest-v1"
    paths:
      - "app/src/types/garpaCommonsSeededBuildManifest.ts"
      - "app/src/lib/garpa/commonsSeededBuildManifestDigest.ts"
      - "app/src/lib/garpa/validateCommonsSeededBuildManifest.ts"
      - "app/src/lib/garpa/runCommonsSeededBuildManifestGate.ts"
      - "app/src/lib/garpa/renderCommonsSeededBuildManifest.ts"
      - "app/src/lib/garpa/garpaVersion.ts"
      - "app/src/lib/garpa/implementedStages.ts"
      - "tests/fixtures/garpaCommonsSeededBuildManifestFixture.ts"
      - "tests/lib/garpaCommonsSeededBuildManifest.test.ts"
      - "tests/lib/garpaMethodVersion.test.ts"
      - "examples/garpa-commons-seeded-build-manifest/**"
      - "schemas/garpa/commons-seeded-build-manifest-*.schema.json"
      - "docs/garpa-commons-seeded-build-manifest.md"
      - "docs/garpa-method-version.md"
      - "mcp/garpaCommonsSeededBuildManifestTools.ts"
      - "mcp/garpa-commons-seeded-build-manifest-server.ts"
      - "mcp/tsconfig.commons-seeded-build-manifest.json"
      - "mcp/README-GARPA-COMMONS-SEEDED-BUILD-MANIFEST.md"
      - "mcp/garpaCompleteServer.ts"
      - "tsconfig.commons-seeded-build-manifest.json"
      - ".github/workflows/garpa-commons-seeded-build-manifest-check.yml"

permissions:
  contents: read

jobs:
  seeded-build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install workbench dependencies
        run: npm ci

      - name: Run GARPA Commons-seeded build-manifest tests
        run: npx vitest run tests/lib/garpaCommonsSeededBuildManifest.test.ts tests/lib/garpaMethodVersion.test.ts

      - name: Typecheck GARPA Commons-seeded build-manifest surface
        run: npx tsc --noEmit -p tsconfig.commons-seeded-build-manifest.json

      - name: Build static workbench bundle
        run: npx vite build

      - name: Install MCP dependencies
        run: npm ci
        working-directory: mcp

      - name: Typecheck GARPA Commons-seeded build-manifest MCP server
        run: npx tsc --noEmit -p tsconfig.commons-seeded-build-manifest.json
        working-directory: mcp
