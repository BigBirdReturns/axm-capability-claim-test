name: garpa-commons-seeded-build-manifest-tag

on:
  push:
    branches:
      - "feature/garpa-commons-seeded-build-manifest-v1"

permissions:
  contents: write

jobs:
  qualify-and-open-successor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Prove the governed surface
        run: |
          npx vitest run \
            tests/lib/garpaCommonsSeededBuildManifest.test.ts \
            tests/lib/garpaMethodVersion.test.ts \
            tests/lib/garpaCaseWorkspace.test.ts
          npx tsc --noEmit -p tsconfig.commons-seeded-build-manifest.json
          npm run build
      - run: npm ci
        working-directory: mcp
      - run: npx tsc --noEmit -p tsconfig.commons-seeded-build-manifest.json
        working-directory: mcp
      - name: Seal qualified head and open the build-receipt successor
        run: |
          git tag -f garpa-build-manifest-qualified-v0.8.0 "$GITHUB_SHA"
          git push origin refs/tags/garpa-build-manifest-qualified-v0.8.0 --force
          if ! git ls-remote --exit-code --heads origin feature/garpa-commons-seeded-build-receipt-v1 >/dev/null 2>&1; then
            git push origin "$GITHUB_SHA:refs/heads/feature/garpa-commons-seeded-build-receipt-v1"
          fi
