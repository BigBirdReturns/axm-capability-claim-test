name: garpa-commons-seeded-mission-evaluation-diagnostic

on:
  push:
    branches:
      - "feature/garpa-commons-seeded-mission-evaluation-v1"

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feature/garpa-commons-seeded-mission-evaluation-v1
          fetch-depth: 0

      - name: Synchronize predecessor and governing method surface
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/garpa-commons-seeded-test-run-v1
          git merge --no-edit origin/feature/garpa-commons-seeded-test-run-v1
          git fetch origin feature/garpa-commons-seeded-build-manifest-v1
          git show origin/feature/garpa-commons-seeded-build-manifest-v1:mcp/garpaArtifactAdapters.ts > mcp/garpaArtifactAdapters.ts
          python - <<'PY'
          from pathlib import Path
          import re
          Path('app/src/lib/garpa/garpaVersion.ts').write_text(
              'export const GARPA_METHOD_VERSION = "1.2.0-commons-seeded-mission-evaluation";\n'
          )
          p = Path('app/src/lib/garpa/implementedStages.ts')
          s = p.read_text()
          if '"commons_seeded_mission_evaluation"' not in s:
              s = s.replace('] as const;', '  "commons_seeded_mission_evaluation",\n] as const;', 1)
          p.write_text(s)
          Path('tests/lib/garpaMethodVersion.test.ts').write_text('''import { describe, expect, it } from "vitest";
          import { GARPA_METHOD_VERSION } from "../../app/src/lib/garpa/garpaVersion";
          import { IMPLEMENTED_GARPA_STAGES } from "../../app/src/lib/garpa/implementedStages";

          describe("GARPA method version", () => {
            it("names the Commons-seeded mission-evaluation surface", () => {
              expect(GARPA_METHOD_VERSION).toBe("1.2.0-commons-seeded-mission-evaluation");
              expect(IMPLEMENTED_GARPA_STAGES.at(-1)).toBe("commons_seeded_mission_evaluation");
              expect(IMPLEMENTED_GARPA_STAGES).toContain("commons_seeded_test_run");
              expect(IMPLEMENTED_GARPA_STAGES).toContain("commons_seeded_preflight");
            });
          });
          '''.replace('          ', ''))
          Path('docs/garpa-method-version.md').write_text('''# GARPA method version

          Current branch method version: `1.2.0-commons-seeded-mission-evaluation`.

          The highest governed stage is `commons_seeded_mission_evaluation`. It recomputes the complete target run ledger, retains every failure, abort, invalidation, incomplete run and explicit exclusion, verifies the frozen scenario and metric boundary, and delegates the bounded disposition to the existing custodied mission-evaluation gate.

          Mission-evaluation admission does not establish vendor parity, deployment authority, or publication authority.
          '''.replace('          ', ''))
          p = Path('docs/garpa-current-surface.md')
          s = p.read_text() if p.exists() else '# GARPA current surface\n'
          if 'commons_seeded_mission_evaluation' not in s:
              s += '\n## Commons-seeded mission evaluation\n\nThe highest governed stage is `commons_seeded_mission_evaluation`. It admits a bounded target disposition only after the complete known-run ledger and the existing custodied mission-evaluation gate agree.\n'
          p.write_text(s)
          p = Path('mcp/garpaCompleteServer.ts')
          s = p.read_text()
          imp = 'import { registerGarpaCommonsSeededMissionEvaluationTools } from "./garpaCommonsSeededMissionEvaluationTools.ts";\n'
          if imp not in s:
              marker = 'import { registerGarpaMethodTools } from "./garpaMethodTools.ts";\n'
              s = s.replace(marker, imp + marker, 1)
          s = re.sub(r'version: "[^"]+"', 'version: "1.2.0"', s, count=1)
          call = 'registerGarpaCommonsSeededMissionEvaluationTools(server);\n'
          if call not in s:
              marker = 'registerGarpaMethodTools(server);\n'
              s = s.replace(marker, marker + call, 1)
          p.write_text(s)
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Run qualification campaign and retain every log
        id: campaign
        shell: bash
        run: |
          set +e
          mkdir -p .garpa/mission-evaluation-qualification
          npm ci > .garpa/mission-evaluation-qualification/npm-ci.log 2>&1
          S0=$?
          npx tsx scripts/discoverCommonsOrdinaryEvaluationArguments.ts > .garpa/mission-evaluation-qualification/discovery.log 2>&1
          S1=$?
          if [ "$S1" = "0" ]; then
            npx tsx scripts/generateCommonsSeededMissionEvaluationExample.ts > .garpa/mission-evaluation-qualification/generate.log 2>&1
            S2=$?
          else
            echo "generation skipped because discovery failed" > .garpa/mission-evaluation-qualification/generate.log
            S2=1
          fi
          npx vitest run tests/lib/garpaCommonsSeededMissionEvaluation.test.ts tests/lib/garpaCommonsSeededTestRun.test.ts tests/lib/garpaCommonsSeededPreflight.test.ts tests/lib/garpaMethodVersion.test.ts tests/lib/garpaCaseWorkspace.test.ts > .garpa/mission-evaluation-qualification/focused.log 2>&1
          S3=$?
          npx tsc --noEmit -p tsconfig.commons-seeded-mission-evaluation.json > .garpa/mission-evaluation-qualification/scoped-tsc.log 2>&1
          S4=$?
          npm run check > .garpa/mission-evaluation-qualification/full-check.log 2>&1
          S5=$?
          npm run build > .garpa/mission-evaluation-qualification/build.log 2>&1
          S6=$?
          (cd mcp && npm ci > ../.garpa/mission-evaluation-qualification/mcp-ci.log 2>&1)
          S7=$?
          (cd mcp && npx tsc --noEmit -p tsconfig.commons-seeded-mission-evaluation.json > ../.garpa/mission-evaluation-qualification/mcp-scoped.log 2>&1)
          S8=$?
          (cd mcp && npx tsc --noEmit -p tsconfig.json > ../.garpa/mission-evaluation-qualification/mcp-complete.log 2>&1)
          S9=$?
          TOTAL=$((S0+S1+S2+S3+S4+S5+S6+S7+S8+S9))
          python - "$S0" "$S1" "$S2" "$S3" "$S4" "$S5" "$S6" "$S7" "$S8" "$S9" <<'PY'
          import json, sys
          names = ['npm_ci','discovery','generation','focused','scoped_tsc','full_check','build','mcp_ci','mcp_scoped','mcp_complete']
          values = list(map(int, sys.argv[1:]))
          status = {
            'passed': all(value == 0 for value in values),
            'methodVersion': '1.2.0-commons-seeded-mission-evaluation',
            'highestStage': 'commons_seeded_mission_evaluation',
            'results': dict(zip(names, values)),
          }
          open('.garpa/mission-evaluation-qualification/status.json','w').write(json.dumps(status, indent=2) + '\n')
          PY
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: garpa-commons-seeded-mission-evaluation-qualification
          path: .garpa/mission-evaluation-qualification
          retention-days: 3

      - name: Commit qualified or diagnostic state
        run: |
          rm -f .github/workflows/garpa-commons-seeded-mission-evaluation-finalize.yml
          rm -f .github/workflows/garpa-commons-seeded-mission-evaluation-diagnostic.yml
          git add -A
          if [ "${{ steps.campaign.outputs.total }}" = "0" ]; then
            cp .garpa/mission-evaluation-qualification/status.json .garpa/commons-seeded-mission-evaluation-qualified.json
            git add .garpa/commons-seeded-mission-evaluation-qualified.json
            git commit -m "Admit Commons-seeded target mission evaluation"
          else
            git commit -m "Record Commons mission-evaluation qualification diagnostics"
          fi
          git push origin HEAD:feature/garpa-commons-seeded-mission-evaluation-v1

      - name: Open successor branch after qualification
        if: steps.campaign.outputs.total == '0'
        run: |
          if ! git ls-remote --exit-code --heads origin feature/garpa-commons-seeded-vendor-parity-v1 >/dev/null 2>&1; then
            git push origin HEAD:refs/heads/feature/garpa-commons-seeded-vendor-parity-v1
          fi

      - name: Fail after preserving diagnostics
        if: steps.campaign.outputs.total != '0'
        run: exit 1
