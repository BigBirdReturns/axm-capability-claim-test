name: garpa-commons-seeded-mission-evaluation-finalize

on:
  push:
    branches:
      - "feature/garpa-commons-seeded-mission-evaluation-v1"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feature/garpa-commons-seeded-mission-evaluation-v1
          fetch-depth: 0

      - name: Merge the latest qualified test-run predecessor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/garpa-commons-seeded-test-run-v1
          git merge --no-edit origin/feature/garpa-commons-seeded-test-run-v1

      - name: Restore unsupported-artifact safety custody
        run: |
          git fetch origin feature/garpa-commons-seeded-build-manifest-v1
          git show origin/feature/garpa-commons-seeded-build-manifest-v1:mcp/garpaArtifactAdapters.ts > mcp/garpaArtifactAdapters.ts

      - name: Advance method and aggregate MCP surfaces
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          Path('app/src/lib/garpa/garpaVersion.ts').write_text(
              'export const GARPA_METHOD_VERSION = "1.2.0-commons-seeded-mission-evaluation";\n'
          )

          p = Path('app/src/lib/garpa/implementedStages.ts')
          s = p.read_text()
          if '"commons_seeded_mission_evaluation"' not in s:
              marker = '] as const;'
              assert marker in s
              s = s.replace(marker, '  "commons_seeded_mission_evaluation",\n' + marker, 1)
          p.write_text(s)

          Path('tests/lib/garpaMethodVersion.test.ts').write_text('''import { describe, expect, it } from "vitest";
          import { GARPA_METHOD_VERSION } from "../../app/src/lib/garpa/garpaVersion";
          import { IMPLEMENTED_GARPA_STAGES } from "../../app/src/lib/garpa/implementedStages";

          describe("GARPA method version", () => {
            it("names the Commons-seeded mission-evaluation surface", () => {
              expect(GARPA_METHOD_VERSION).toBe(
                "1.2.0-commons-seeded-mission-evaluation",
              );
              expect(
                IMPLEMENTED_GARPA_STAGES[IMPLEMENTED_GARPA_STAGES.length - 1],
              ).toBe("commons_seeded_mission_evaluation");
              expect(IMPLEMENTED_GARPA_STAGES).toContain("commons_seeded_test_run");
              expect(IMPLEMENTED_GARPA_STAGES).toContain("commons_seeded_preflight");
            });
          });
          '''.replace('          ', ''))

          Path('docs/garpa-method-version.md').write_text('''# GARPA method version

          Current branch method version: `1.2.0-commons-seeded-mission-evaluation`.

          The highest governed stage is `commons_seeded_mission_evaluation`. It recomputes the complete target test-run ledger, retains every failure, abort, invalidation, incomplete run and explicit exclusion, verifies the frozen scenario and metric boundary, and delegates the bounded disposition to the existing custodied mission-evaluation gate.

          Mission-evaluation admission does not establish vendor parity, deployment authority, or publication authority. Qualification transfer and mission-equivalence assertions remain structurally false outside the ordinary target evaluation.
          '''.replace('          ', ''))

          p = Path('docs/garpa-current-surface.md')
          s = p.read_text() if p.exists() else '# GARPA current surface\n'
          if 'commons_seeded_mission_evaluation' not in s:
              s += '\n## Commons-seeded mission evaluation\n\nThe highest governed stage is `commons_seeded_mission_evaluation`. It admits a bounded target disposition only after the complete known-run ledger and the existing custodied mission-evaluation gate agree.\n'
          p.write_text(s)

          p = Path('mcp/garpaCompleteServer.ts')
          s = p.read_text()
          imp = 'import { registerGarpaCommonsSeededMissionEvaluationTools } from "./garpaCommonsSeededMissionEvaluationTools.ts";\n'
          if imp not in s:
              marker = 'import { registerGarpaMethodTools } from "./garpaMethodTools.ts";\n'
              assert marker in s
              s = s.replace(marker, imp + marker, 1)
          s = re.sub(r'version: "[^"]+"', 'version: "1.2.0"', s, count=1)
          call = 'registerGarpaCommonsSeededMissionEvaluationTools(server);\n'
          if call not in s:
              marker = 'registerGarpaMethodTools(server);\n'
              assert marker in s
              s = s.replace(marker, marker + call, 1)
          p.write_text(s)
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install workbench dependencies
        run: npm ci

      - name: Discover the existing ordinary evaluation fixture
        run: npx tsx scripts/discoverCommonsOrdinaryEvaluationArguments.ts

      - name: Generate the executable example
        run: npx tsx scripts/generateCommonsSeededMissionEvaluationExample.ts

      - name: Qualify the complete mission-evaluation surface
        run: |
          npx vitest run \
            tests/lib/garpaCommonsSeededMissionEvaluation.test.ts \
            tests/lib/garpaCommonsSeededTestRun.test.ts \
            tests/lib/garpaCommonsSeededPreflight.test.ts \
            tests/lib/garpaMethodVersion.test.ts \
            tests/lib/garpaCaseWorkspace.test.ts
          npx tsc --noEmit -p tsconfig.commons-seeded-mission-evaluation.json
          npm run check
          npm run build

      - name: Qualify MCP surfaces
        run: |
          npm ci
          npx tsc --noEmit -p tsconfig.commons-seeded-mission-evaluation.json
          npx tsc --noEmit -p tsconfig.json
        working-directory: mcp

      - name: Seal qualified mission-evaluation surface
        run: |
          mkdir -p .garpa
          python - <<'PY'
          from pathlib import Path
          import json
          status = json.loads(Path('examples/garpa-commons-seeded-mission-evaluation/status.json').read_text())
          status.update({
            'methodVersion': '1.2.0-commons-seeded-mission-evaluation',
            'highestStage': 'commons_seeded_mission_evaluation',
            'qualification': {
              'focusedTests': 'pass',
              'scopedTypecheck': 'pass',
              'fullCheck': 'pass',
              'staticBuild': 'pass',
              'dedicatedMcpTypecheck': 'pass',
              'completeMcpTypecheck': 'pass',
            },
          })
          Path('.garpa/commons-seeded-mission-evaluation-qualified.json').write_text(
            json.dumps(status, indent=2) + '\n'
          )
          PY
          rm .github/workflows/garpa-commons-seeded-mission-evaluation-finalize.yml
          git add -A
          git commit -m "Admit Commons-seeded target mission evaluation"
          git push origin HEAD:feature/garpa-commons-seeded-mission-evaluation-v1
