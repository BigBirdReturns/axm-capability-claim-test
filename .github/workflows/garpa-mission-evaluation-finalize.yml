name: garpa-mission-evaluation-finalize

on:
  push:
    branches:
      - "feature/garpa-commons-seeded-mission-evaluation-v1"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feature/garpa-commons-seeded-mission-evaluation-v1
          fetch-depth: 0

      - name: Advance method and aggregate surfaces
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          import re

          Path('app/src/lib/garpa/garpaVersion.ts').write_text(
              'export const GARPA_METHOD_VERSION = "1.2.0-commons-seeded-mission-evaluation";\n'
          )

          p = Path('app/src/lib/garpa/implementedStages.ts')
          s = p.read_text()
          if '"commons_seeded_mission_evaluation"' not in s:
              s = s.replace(
                  '] as const;',
                  '  "commons_seeded_mission_evaluation",\n] as const;',
                  1,
              )
          p.write_text(s)

          Path('tests/lib/garpaMethodVersion.test.ts').write_text('''import { describe, expect, it } from "vitest";
          import { GARPA_METHOD_VERSION } from "../../app/src/lib/garpa/garpaVersion";
          import { IMPLEMENTED_GARPA_STAGES } from "../../app/src/lib/garpa/implementedStages";

          describe("GARPA method version", () => {
            it("names the Commons-seeded mission-evaluation surface", () => {
              expect(GARPA_METHOD_VERSION).toBe(
                "1.2.0-commons-seeded-mission-evaluation",
              );
              expect(
                IMPLEMENTED_GARPA_STAGES[IMPLEMENTED_GARPA_STAGES.length - 1],
              ).toBe("commons_seeded_mission_evaluation");
              expect(IMPLEMENTED_GARPA_STAGES).toContain("commons_seeded_test_run");
              expect(IMPLEMENTED_GARPA_STAGES).toContain("commons_seeded_preflight");
            });
          });
          '''.replace('          ', ''))

          Path('docs/garpa-method-version.md').write_text('''# GARPA method version

          Current branch method version: `1.2.0-commons-seeded-mission-evaluation`.

          The highest governed stage is `commons_seeded_mission_evaluation`. It aggregates the complete set of admitted Commons-seeded target executions, preserves failed, aborted, invalidated, and incomplete runs, verifies exact run and upstream digest custody, and delegates the bounded mission conclusion to the existing custodied mission-evaluation gate.

          Automatic physical execution is not implemented or authorized. Mission-evaluation admission does not establish vendor parity, deployment authority, or publication authority.
          '''.replace('          ', ''))

          p = Path('docs/garpa-current-surface.md')
          s = p.read_text()
          if '## Commons-seeded mission evaluation' not in s:
              s += '''

          ## Commons-seeded mission evaluation

          The current highest governed stage is `commons_seeded_mission_evaluation`. It aggregates the complete admitted target run set and delegates the bounded outcome classification to the existing custodied mission-evaluation gate. Receipt admission, mission adequacy, vendor parity, deployment, and publication remain distinct states.
          '''.replace('          ', '')
          p.write_text(s)

          p = Path('mcp/garpaCompleteServer.ts')
          s = p.read_text()
          imp = 'import { registerGarpaCommonsSeededMissionEvaluationTools } from "./garpaCommonsSeededMissionEvaluationTools.ts";\n'
          if imp not in s:
              marker = 'import { registerGarpaMethodTools } from "./garpaMethodTools.ts";\n'
              assert marker in s
              s = s.replace(marker, imp + marker, 1)
          s = re.sub(r'version: "[^"]+"', 'version: "1.2.0"', s, count=1)
          call = 'registerGarpaCommonsSeededMissionEvaluationTools(server);\n'
          if call not in s:
              marker = 'registerGarpaMethodTools(server);\n'
              assert marker in s
              s = s.replace(marker, marker + call, 1)
          p.write_text(s)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Qualify workbench surface
        run: |
          npm ci
          npx vitest run \
            tests/lib/garpaCommonsSeededMissionEvaluation.test.ts \
            tests/lib/garpaCommonsSeededTestRun.test.ts \
            tests/lib/garpaCommonsSeededPreflight.test.ts \
            tests/lib/garpaMethodVersion.test.ts \
            tests/lib/garpaCaseWorkspace.test.ts
          npx tsc --noEmit -p tsconfig.commons-seeded-mission-evaluation.json
          npm run check
          npm run build

      - name: Qualify MCP surfaces
        run: |
          npm ci
          npx tsc --noEmit -p tsconfig.commons-seeded-mission-evaluation.json
          npx tsc --noEmit -p tsconfig.json
        working-directory: mcp

      - name: Generate executable example
        run: |
          mkdir -p examples/garpa-commons-seeded-mission-evaluation
          cat > /tmp/write-mission-evaluation-example.ts <<'TS'
          import { writeFile } from "node:fs/promises";
          import { buildCommonsSeededMissionEvaluationRequest } from "./tests/fixtures/garpaCommonsSeededMissionEvaluationFixture.ts";
          import { runCommonsSeededMissionEvaluationGate } from "./app/src/lib/garpa/runCommonsSeededMissionEvaluationGate.ts";
          import { renderCommonsSeededMissionEvaluationMarkdown } from "./app/src/lib/garpa/renderCommonsSeededMissionEvaluation.ts";
          const request = buildCommonsSeededMissionEvaluationRequest();
          const result = runCommonsSeededMissionEvaluationGate(request);
          if (!result.passed) throw new Error(JSON.stringify(result));
          const directory = "examples/garpa-commons-seeded-mission-evaluation";
          await writeFile(`${directory}/request.json`, `${JSON.stringify(request, null, 2)}\n`);
          await writeFile(`${directory}/result.json`, `${JSON.stringify(result, null, 2)}\n`);
          await writeFile(`${directory}/evaluation.md`, renderCommonsSeededMissionEvaluationMarkdown(request, result));
          TS
          npx tsx /tmp/write-mission-evaluation-example.ts

      - name: Commit qualified surface and remove finalizer
        run: |
          rm .github/workflows/garpa-mission-evaluation-finalize.yml
          git add -A
          git commit -m "Admit Commons-seeded mission evaluation"
          git push origin HEAD:feature/garpa-commons-seeded-mission-evaluation-v1
