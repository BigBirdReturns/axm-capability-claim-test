name: garpa-registry-check

on:
  pull_request:
    paths:
      - "app/src/types/garpaRegistry.ts"
      - "app/src/lib/garpa/validateCaseRegistry.ts"
      - "app/src/lib/garpa/runRegistryUpdateGate.ts"
      - "app/src/lib/garpa/renderRegistryUpdate.ts"
      - "tests/lib/garpaRegistry.test.ts"
      - "examples/garpa-registry/**"
      - "schemas/garpa/case-registry-entry.schema.json"
      - "schemas/garpa/registry-release-update-request.schema.json"
      - "schemas/garpa/registry-update-result.schema.json"
      - "mcp/garpaRegistryTools.ts"
      - "mcp/garpa-registry-server.ts"
      - "mcp/tsconfig.registry.json"
      - ".github/workflows/garpa-registry-check.yml"
  push:
    branches:
      - "feature/garpa-admission-spine-v1"
    paths:
      - "app/src/types/garpaRegistry.ts"
      - "app/src/lib/garpa/validateCaseRegistry.ts"
      - "app/src/lib/garpa/runRegistryUpdateGate.ts"
      - "app/src/lib/garpa/renderRegistryUpdate.ts"
      - "tests/lib/garpaRegistry.test.ts"
      - "examples/garpa-registry/**"
      - "schemas/garpa/case-registry-entry.schema.json"
      - "schemas/garpa/registry-release-update-request.schema.json"
      - "schemas/garpa/registry-update-result.schema.json"
      - "mcp/garpaRegistryTools.ts"
      - "mcp/garpa-registry-server.ts"
      - "mcp/tsconfig.registry.json"
      - ".github/workflows/garpa-registry-check.yml"

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install workbench dependencies
        run: npm ci

      - name: Run GARPA registry tests
        run: npx vitest run tests/lib/garpaRegistry.test.ts

      - name: Typecheck workbench
        run: npm run typecheck

      - name: Build workbench
        run: npm run build

      - name: Install MCP dependencies
        run: npm ci
        working-directory: mcp

      - name: Typecheck GARPA registry MCP server
        run: npx tsc --noEmit -p tsconfig.registry.json
        working-directory: mcp
