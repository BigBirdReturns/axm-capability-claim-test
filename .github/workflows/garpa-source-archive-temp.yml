name: garpa-source-archive-temp

on:
  push:
    branches:
      - "feature/garpa-commons-seeded-build-manifest-v1"

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: garpa-seeded-build-manifest-source
          path: .
          include-hidden-files: true
          retention-days: 1
