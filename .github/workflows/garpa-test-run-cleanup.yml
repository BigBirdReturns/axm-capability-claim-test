name: garpa-test-run-cleanup

on:
  pull_request:
    branches:
      - "feature/garpa-commons-seeded-preflight-v1"
    paths:
      - ".github/workflows/garpa-test-run-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'feature/garpa-commons-seeded-test-run-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head branch
        uses: actions/checkout@v4
        with:
          ref: feature/garpa-commons-seeded-test-run-v1
          fetch-depth: 0

      - name: Retain compact receipts and remove temporary diagnostics
        run: |
          mkdir -p .garpa
          if [ -f .garpa/test-run-qualification/status.json ]; then
            cp .garpa/test-run-qualification/status.json .garpa/test-run-qualification-status.json
          fi
          rm -rf .garpa/test-run-qualification
          rm -f .garpa/test-run-finalize-fail.json
          rm -f .github/workflows/garpa-test-run-finalize.yml
          rm -f .github/workflows/garpa-test-run-finalize-pr.yml
          rm -f .github/workflows/garpa-test-run-diagnostic.yml
          rm -f .github/workflows/garpa-test-run-cleanup.yml

      - name: Commit compact qualification receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Compact Commons test-run qualification receipt"
          git push origin HEAD:feature/garpa-commons-seeded-test-run-v1
