name: garpa-test-run-diagnostic

on:
  pull_request:
    branches:
      - "feature/garpa-commons-seeded-preflight-v1"
    paths:
      - ".github/workflows/garpa-test-run-diagnostic.yml"

permissions:
  contents: write

jobs:
  qualify:
    if: github.event.pull_request.head.ref == 'feature/garpa-commons-seeded-test-run-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head branch
        uses: actions/checkout@v4
        with:
          ref: feature/garpa-commons-seeded-test-run-v1
          fetch-depth: 0

      - name: Patch governing surface
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/garpa-commons-seeded-preflight-v1
          git merge --no-edit origin/feature/garpa-commons-seeded-preflight-v1
          git fetch origin feature/garpa-commons-seeded-build-manifest-v1
          git show origin/feature/garpa-commons-seeded-build-manifest-v1:mcp/garpaArtifactAdapters.ts > mcp/garpaArtifactAdapters.ts
          python - <<'PY'
          from pathlib import Path
          import re

          Path('app/src/lib/garpa/garpaVersion.ts').write_text(
              'export const GARPA_METHOD_VERSION = "1.1.0-commons-seeded-test-run";\n'
          )
          p = Path('app/src/lib/garpa/implementedStages.ts')
          s = p.read_text()
          if '"commons_seeded_test_run"' not in s:
              s = s.replace('] as const;', '  "commons_seeded_test_run",\n] as const;', 1)
          p.write_text(s)
          Path('tests/lib/garpaMethodVersion.test.ts').write_text('''import { describe, expect, it } from "vitest";
          import { GARPA_METHOD_VERSION } from "../../app/src/lib/garpa/garpaVersion";
          import { IMPLEMENTED_GARPA_STAGES } from "../../app/src/lib/garpa/implementedStages";

          describe("GARPA method version", () => {
            it("names the Commons-seeded test-run surface", () => {
              expect(GARPA_METHOD_VERSION).toBe("1.1.0-commons-seeded-test-run");
              expect(IMPLEMENTED_GARPA_STAGES.at(-1)).toBe("commons_seeded_test_run");
              expect(IMPLEMENTED_GARPA_STAGES).toContain("commons_seeded_preflight");
              expect(IMPLEMENTED_GARPA_STAGES).toContain("commons_seeded_build_receipt");
            });
          });
          '''.replace('          ', ''))
          Path('docs/garpa-method-version.md').write_text('''# GARPA method version

          Current branch method version: `1.1.0-commons-seeded-test-run`.

          The highest governed stage is `commons_seeded_test_run`. It admits one exact reserved execution receipt while preserving pass, failure, abort, invalidation, and incomplete dispositions without converting them into mission adequacy.

          Automatic physical execution is not implemented or authorized. Test-run admission does not establish mission adequacy, vendor parity, deployment authority, or publication authority.
          '''.replace('          ', ''))
          p = Path('docs/garpa-current-surface.md')
          s = p.read_text() if p.exists() else '# GARPA current surface\n'
          if 'commons_seeded_test_run' not in s:
              s += '\n## Commons-seeded test run\n\nThe highest governed stage is `commons_seeded_test_run`. It admits the evidence receipt for one exact reserved execution while preserving pass, fail, abort, invalidation, and incomplete dispositions.\n'
          p.write_text(s)
          p = Path('mcp/garpaCompleteServer.ts')
          s = p.read_text()
          imp = 'import { registerGarpaCommonsSeededTestRunTools } from "./garpaCommonsSeededTestRunTools.ts";\n'
          if imp not in s:
              marker = 'import { registerGarpaMethodTools } from "./garpaMethodTools.ts";\n'
              s = s.replace(marker, imp + marker, 1)
          s = re.sub(r'version: "[^"]+"', 'version: "1.1.0"', s, count=1)
          call = 'registerGarpaCommonsSeededTestRunTools(server);\n'
          if call not in s:
              marker = 'registerGarpaMethodTools(server);\n'
              s = s.replace(marker, marker + call, 1)
          p.write_text(s)
          p = Path('tests/lib/garpaCommonsSeededTestRun.test.ts')
          s = p.read_text()
          s = s.replace(
              'request.executionEnvelope.qualificationTransferred = true as false;',
              '(request.executionEnvelope as unknown as { qualificationTransferred: boolean }).qualificationTransferred = true;',
          )
          s = s.replace(
              'request.executionEnvelope.missionEquivalenceClaimed = true as false;',
              '(request.executionEnvelope as unknown as { missionEquivalenceClaimed: boolean }).missionEquivalenceClaimed = true;',
          )
          p.write_text(s)
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Run qualification campaign without losing logs
        id: campaign
        shell: bash
        run: |
          set +e
          mkdir -p .garpa/test-run-qualification
          npm ci > .garpa/test-run-qualification/npm-ci.log 2>&1
          S0=$?
          npx vitest run tests/lib/garpaCommonsSeededTestRun.test.ts tests/lib/garpaCommonsSeededPreflight.test.ts tests/lib/garpaMethodVersion.test.ts tests/lib/garpaCaseWorkspace.test.ts > .garpa/test-run-qualification/focused.log 2>&1
          S1=$?
          npx tsc --noEmit -p tsconfig.commons-seeded-test-run.json > .garpa/test-run-qualification/scoped-tsc.log 2>&1
          S2=$?
          npm run check > .garpa/test-run-qualification/full-check.log 2>&1
          S3=$?
          npm run build > .garpa/test-run-qualification/build.log 2>&1
          S4=$?
          (cd mcp && npm ci > ../.garpa/test-run-qualification/mcp-ci.log 2>&1)
          S5=$?
          (cd mcp && npx tsc --noEmit -p tsconfig.commons-seeded-test-run.json > ../.garpa/test-run-qualification/mcp-scoped.log 2>&1)
          S6=$?
          (cd mcp && npx tsc --noEmit -p tsconfig.json > ../.garpa/test-run-qualification/mcp-complete.log 2>&1)
          S7=$?
          TOTAL=$((S0+S1+S2+S3+S4+S5+S6+S7))
          python - "$S0" "$S1" "$S2" "$S3" "$S4" "$S5" "$S6" "$S7" <<'PY'
          import json, sys
          names = ['npm_ci','focused','scoped_tsc','full_check','build','mcp_ci','mcp_scoped','mcp_complete']
          values = list(map(int, sys.argv[1:]))
          data = {'passed': all(value == 0 for value in values), 'results': dict(zip(names, values))}
          open('.garpa/test-run-qualification/status.json','w').write(json.dumps(data, indent=2) + '\n')
          open('.garpa/test-run-finalize-pass.json' if data['passed'] else '.garpa/test-run-finalize-fail.json','w').write(json.dumps(data, indent=2) + '\n')
          PY
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload qualification diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: garpa-test-run-qualification
          path: .garpa/test-run-qualification
          retention-days: 3

      - name: Commit qualified or diagnostic state
        run: |
          if [ "${{ steps.campaign.outputs.total }}" = "0" ]; then
            rm -f .github/workflows/garpa-test-run-finalize.yml
            rm -f .github/workflows/garpa-test-run-finalize-pr.yml
            rm -f .github/workflows/garpa-test-run-diagnostic.yml
            git add -A
            git commit -m "Admit Commons-seeded target test-run receipts"
          else
            git add -A
            git commit -m "Record Commons test-run qualification diagnostics"
          fi
          git push origin HEAD:feature/garpa-commons-seeded-test-run-v1

      - name: Fail the workflow after preserving diagnostics
        if: steps.campaign.outputs.total != '0'
        run: exit 1
